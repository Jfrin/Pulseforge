# Reusable pipeline for one Python service. Called by the per-service workflows.
name: python-service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      coverage_min:
        type: number
        default: 70

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ inputs.service }}/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=${{ inputs.coverage_min }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ inputs.service }}
          path: services/${{ inputs.service }}/coverage.xml

  docker:
    name: image build + vulnerability scan
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          target: runtime
          load: true
          tags: pulseforge-${{ inputs.service }}:ci
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
      - name: Scan image (HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: pulseforge-${{ inputs.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.service }}
          tags: |
            type=sha
            type=raw,value=latest
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ inputs.service }}
