services:
  mock-source:
    build:
      context: ./services/mock-source
      target: runtime
    ports:
      - "8090:8000"
    environment:
      MOCK_SEED: ${MOCK_SEED:-42}
      MOCK_BASE_GAMES: ${MOCK_BASE_GAMES:-200}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  source-connectors-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: source_connectors
      POSTGRES_USER: ${SC_DB_USER:-pulseforge}
      POSTGRES_PASSWORD: ${SC_DB_PASSWORD:-pulseforge}
    ports:
      - "5433:5432"   # dev inspection only
    volumes:
      - source_connectors_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d source_connectors"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO's community images were removed from Docker Hub. This is Silo, the maintained MinIO
    # fork (same env vars, same `mc`). Any S3-compatible store works: override with S3_IMAGE.
    image: ${S3_IMAGE:-pgsty/silo:RELEASE.2026-08-06T00-00-00Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pulseforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pulseforge-minio}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  source-connectors:
    build:
      context: ./services/source-connectors
      target: runtime
    environment:
      DATABASE_URL: postgresql://${SC_DB_USER:-pulseforge}:${SC_DB_PASSWORD:-pulseforge}@source-connectors-db:5432/source_connectors
      MOCK_SOURCE_URL: http://mock-source:8000
      POLL_INTERVAL_S: ${POLL_INTERVAL_S:-15}
      CATALOG_INTERVAL_S: ${CATALOG_INTERVAL_S:-300}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      BATCH_MAX_AGE_S: ${BATCH_MAX_AGE_S:-300}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-pulseforge}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-pulseforge-minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-pulseforge}
      CSV_IMPORT_DIR: /imports
      CSV_INTERVAL_S: ${CSV_INTERVAL_S:-30}
      STEAM_APP_IDS: ${STEAM_APP_IDS:-}   # empty = real Steam polling is OFF
      STEAM_INTERVAL_S: ${STEAM_INTERVAL_S:-300}
      STEAM_MAX_PAGES: ${STEAM_MAX_PAGES:-10}
    restart: on-failure
    volumes:
      - ./imports:/imports:ro   # drop *.csv files here
    depends_on:
      mock-source:
        condition: service_healthy
      source-connectors-db:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  source_connectors_pgdata:
  minio_data:
